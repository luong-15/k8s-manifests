apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-producer
  template:
    metadata:
      labels:
        app: order-producer
    spec:
      containers:
      - name: producer
        image: luongmn15/order-producer:v1.0.0
        resources:          
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: KAFKA_BROKER
          value: "kafka:9092"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: order-producer
spec:
  type: NodePort
  selector:
    app: order-producer
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300